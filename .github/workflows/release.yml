name: Build & Release CropShield APK

on:
  push:
    tags:
      - 'v*'      # Triggers on tags like v1, v1.0, v1.0.0, v2, etc.
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g., v4, v4.0.0)'
        required: true
        default: 'v4.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug & Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare Release APK Asset
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${{ github.ref_name || github.event.inputs.version_tag || 'v4' }}"
          # Find generated debug APK
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Found APK at $APK_PATH"
            cp "$APK_PATH" "release-artifacts/CropShield-${TAG_NAME}.apk"
            cp "$APK_PATH" "release-artifacts/CropShield-v4.apk"
            cp "$APK_PATH" "release-artifacts/CropShield-latest.apk"
          else
            echo "APK not found in expected folder, checking entire repo..."
            FALLBACK_APK=$(find . -name "*.apk" | head -n 1)
            cp "$FALLBACK_APK" "release-artifacts/CropShield-${TAG_NAME}.apk"
            cp "$FALLBACK_APK" "release-artifacts/CropShield-v4.apk"
            cp "$FALLBACK_APK" "release-artifacts/CropShield-latest.apk"
          fi
          ls -la release-artifacts

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "CropShield IPM ${{ github.ref_name || github.event.inputs.version_tag || 'v4' }}"
          tag_name: ${{ github.ref_name || github.event.inputs.version_tag || 'v4' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🌾 CropShield IPM Release ${{ github.ref_name || github.event.inputs.version_tag || 'v4' }}
            
            Welcome to the official release of **CropShield IPM v4**!
            
            ### 📥 Direct APK Download:
            * **[Download CropShield-v4.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name || github.event.inputs.version_tag || 'v4' }}/CropShield-v4.apk)**
            * **[Download Latest APK (Always Points to Latest Release)](https://github.com/${{ github.repository }}/releases/latest/download/CropShield-latest.apk)**
            
            ### 📱 How to Install on Android:
            1. Tap the direct download link above from your phone's browser (Chrome, Firefox, Opera, etc.).
            2. When downloaded, tap the APK file from your notification panel or Downloads folder.
            3. If Android displays **"For your security, your phone is not allowed to install unknown apps from this source"**:
               - Tap **Settings**.
               - Turn ON **"Allow from this source"**.
               - Press Back and tap **Install**.
            4. Subsequent updates (e.g. `v5`, `v6`...) can be installed straight over this version without losing your offline field notes, scouting sheets, or farm maps!
          files: |
            release-artifacts/*.apk
